<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-180.png">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sheets.css">
    
    <script>
        // Проверка авторизации
        (function() {
            const session = localStorage.getItem('currentSession');
            if (!session) {
                window.location.href = 'login.html';
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <!-- Шапка с пользователем -->
        <div class="user-info">
            <div class="user-greeting">
                <span class="welcome-emoji">👋</span>
                <span id="welcomeMessage">Добро пожаловать!</span>
            </div>
            <button onclick="logout()" class="logout-btn">
                <span>🚪</span> Выйти
            </button>
        </div>
        
        <!-- Заголовок -->
        <div class="app-header">
            <h1>
                <span class="header-icon">📊</span>
                Мой Google Sheets
            </h1>
            <p class="subtitle">Редактируйте таблицу как в Google Sheets</p>
        </div>
        
        <!-- КОНТЕЙНЕР ДЛЯ ТАБЛИЦЫ (старый интерфейс полностью заменен) -->
        <div id="sheetsContainer"></div>
        
        <!-- Подвал -->
        <div class="app-footer">
            <p>Данные сохраняются автоматически в вашем браузере</p>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="app.js"></script>
    <script src="auth.js"></script>
    <script src="sheets.js"></script>
</body>
</html>
