<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-180.png">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="sheets.css">
    
    <!-- Подключаем Clipsheet из CDN -->
    <script src="https://esm.sh/jsr/@katlyn/clipsheet"></script>
    
    <script>
        (function() {
            const session = localStorage.getItem('currentSession');
            if (!session) {
                window.location.href = 'login.html';
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="user-info">
            <div class="user-greeting">
                <span class="welcome-emoji">👋</span>
                <span id="welcomeMessage">Добро пожаловать!</span>
            </div>
            <button onclick="logout()" class="logout-btn">
                <span>🚪</span> Выйти
            </button>
        </div>
        
        <div class="app-header">
            <h1>
                <span class="header-icon">📊</span>
                Мой Google Sheets
            </h1>
            <p class="subtitle">Импортируйте данные из Google Sheets и редактируйте их</p>
        </div>
        
        <!-- Блок для ввода Google Sheets -->
        <div id="googleSheetsInput" class="google-sheets-section"></div>
        
        <!-- Превью данных -->
        <div id="googleSheetsPreview" class="preview-section"></div>
        
        <!-- Контейнер для таблицы -->
        <div id="sheetsContainer"></div>
        
        <div class="app-footer">
            <p>Данные сохраняются автоматически в вашем браузере</p>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="auth.js"></script>
    <script src="sheets.js"></script>
    <script src="google-sheets.js"></script>
</body>
</html>
