<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё PWA приложение</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-180.png">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="styles.css">
    
    <!-- СНАЧАЛА ПРОВЕРЯЕМ АВТОРИЗАЦИЮ -->
    <script>
        // Этот скрипт выполняется до загрузки страницы
        (function() {
            console.log("Проверка авторизации...");
            const session = localStorage.getItem('currentSession');
            if (!session) {
                console.log("Нет сессии, перенаправляем на login.html");
                window.location.href = 'login.html';
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="user-info">
            <span id="welcomeMessage">Добро пожаловать!</span>
            <button onclick="logout()" class="logout-btn">Выйти</button>
        </div>
        
        <h1>Моё приложение с базой данных</h1>
        
        <div class="add-section">
            <input type="text" id="itemName" placeholder="Введите название">
            <input type="text" id="itemValue" placeholder="Введите значение">
            <button onclick="addItem()" class="add-btn">Добавить</button>
        </div>
        
        <div class="items-section">
            <h2>Сохранённые элементы:</h2>
            <ul id="itemsList"></ul>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="auth.js"></script>
</body>
</html>
