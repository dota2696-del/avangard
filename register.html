<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Мое PWA приложение</title>
    
    <!-- Подключаем манифест -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Иконки -->
    <link rel="apple-touch-icon" href="images/icon-180.png">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    
    <!-- Цвет темы -->
    <meta name="theme-color" content="#000000">
    
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Регистрация в приложении</h1>
        
        <!-- Форма регистрации -->
        <div class="auth-section">
            <form id="registerForm" onsubmit="event.preventDefault(); registerUser();">
                <div class="form-group">
                    <input type="text" id="regUsername" placeholder="Имя пользователя" required>
                </div>
                <div class="form-group">
                    <input type="email" id="regEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="regPassword" placeholder="Пароль" required>
                </div>
                <div class="form-group">
                    <input type="password" id="regConfirmPassword" placeholder="Подтвердите пароль" required>
                </div>
                <button type="submit" class="btn-primary">Зарегистрироваться</button>
            </form>
            
            <div class="auth-links">
                <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </div>
        </div>
    </div>
    
    <!-- Подключаем JavaScript -->
    <script src="auth.js"></script>
</body>
</html>
