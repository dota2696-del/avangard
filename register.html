<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Регистрация в приложении</h1>
        
        <div class="auth-section">
            <div class="form-group">
                <input type="text" id="regUsername" placeholder="Имя пользователя" required>
            </div>
            <div class="form-group">
                <input type="email" id="regEmail" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" id="regPassword" placeholder="Пароль" required>
            </div>
            <div class="form-group">
                <input type="password" id="regConfirmPassword" placeholder="Подтвердите пароль" required>
            </div>
            <button onclick="registerUser()" class="btn-primary">Зарегистрироваться</button>
            
            <div class="auth-links">
                <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </div>
        </div>
    </div>
    
    <script src="auth.js"></script>
</body>
</html>
